# Base URL the frontend uses to reach the EvOwl API.
# Must match the host/port the webapp is served on (see server.port below).
evowl.fetch-endpoint=https://localhost:8444

# Path to the built instructor-tool jar. Use an absolute path.
evowl.instructor-tool.jar-path=/absolute/path/to/evowl-instructor-tool.jar

# MySQL database name. MUST match the database name in spring.datasource.url below.
evowl.instructor-tool.db-name=chosen-database-name

evowl.instructor-ui.enabled=false

server.port=8444
server.ssl.key-store-type=PKCS12
server.ssl.key-store=config/keystore.p12
server.ssl.key-store-password=
server.ssl.enabled=true
server.servlet.session.cookie.secure=true
server.servlet.register-default-servlet=true

lti.instance=
lti.secret=

spring.datasource.url=jdbc:mariadb://localhost:3306/chosen-database-name?sslMode=verify-full&serverSslCert=/absolute/path/to/cert.pem
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.main.allow-circular-references=true

spring.mvc.view.prefix:/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

mybatis.mapper-locations=classpath:mapper/*.xml

logging.level.org.springframework.web=TRACE

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
